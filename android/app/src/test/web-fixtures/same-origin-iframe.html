<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动态同源 iframe 目标视频测试</title>
<style>
  body { font: 18px sans-serif; margin: 20px; }
  iframe { width: 100%; height: 320px; border: 0; }
</style>
<h1>动态同源 iframe 目标视频测试</h1>
<button id="play" onclick="document.querySelector('iframe').contentDocument.querySelector('video').play()">
  播放目标测试视频
</button>
<iframe title="目标播放器" srcdoc="<video controls loop style='width:100%;height:260px'></video><script>document.querySelector('video').src=['https:','','developer.mozilla.org','shared-assets','videos','flower.mp4'].join('/')</script>"></iframe>
</html>
